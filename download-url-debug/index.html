<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Download URL Debug - Sanitized</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, sans-serif;
        background: #111827;
        color: #f9fafb;
      }

      body {
        margin: 0;
        padding: 2rem;
      }

      main {
        max-width: 780px;
        margin: 0 auto;
      }

      .card {
        border: 1px solid #374151;
        border-radius: 12px;
        background: #1f2937;
        padding: 1.5rem;
      }

      .muted {
        color: #9ca3af;
      }

      code {
        border-radius: 6px;
        background: #111827;
        padding: 0.15rem 0.35rem;
      }

      button {
        cursor: not-allowed;
        border: 0;
        border-radius: 8px;
        background: #4b5563;
        color: #d1d5db;
        padding: 0.7rem 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Download URL Debug</h1>
      <section class="card">
        <h2>Sanitized export</h2>
        <p>
          This local copy does not include download targets. The catalogue was
          exported with links removed before local access.
        </p>
        <p class="muted">
          Source file: <code>catalogue.json</code>
        </p>
        <button type="button" disabled>Downloads disabled</button>
      </section>
    </main>
  </body>
</html>
